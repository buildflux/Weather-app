<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter a City name" spellcheck="false">
            <button><img src="icons/search.png" alt=""></button>
        </div>
        <div class="hero">
            <img src="icons/clouds.png" alt="">
            <h2 class="temp">Temprature </h2>
            <h3 class="city-name">City Name</h3>
        </div>
        <div class="footer">
            <div class="humidity">
                <img src="icons/humidity.png" alt="">
                <div class="humidity-text">
                    <p >45%</p>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="speed">
                <img src="icons/wind.png" alt="">
                <div class="speed-text">
                    <p>18 km/hr</p>
                    <p>Wind speed</p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
